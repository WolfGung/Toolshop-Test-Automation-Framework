name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  stand:
    name: Full suite on our own stand
    runs-on: ubuntu-latest
    # The gate, and only the gate: a change proposed or landed here. The
    # nightly schedule and a manual dispatch are the watch on the hosted
    # storefront, which is what docs/06 and the pipeline diagram describe, and
    # what the three jobs below are gated on. Without this the nightly also
    # brought up the stand and ran the whole suite against it, so the schedule
    # did something neither text mentioned.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Bring up the application under test
        run: ./scripts/stand-up.sh
      - name: Run every layer, writes included
        run: pytest -m "" --reruns 1 --reruns-delay 2
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          BASE_URL: http://localhost:4200
          API_BASE_URL: http://localhost:8091
          MOCK_CONTACT_API: "false"
          TIMEOUT_MS: "10000"
          RECORD_VIDEO: "true"
      - name: Stand logs
        if: failure()
        run: docker compose -f docker-compose.stand.yml logs --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-stand
          path: allure-results
      # A green run without a browser failure still records the two e2e
      # flows, but a run can end with none — and an empty directory is not an
      # error here, so it is not warned about either. What the publish job
      # does when the artefact is missing is handled where it downloads it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: videos
          if-no-files-found: ignore

  showcase:
    name: Publish showcase
    runs-on: ubuntu-latest
    needs: stand
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    # Two pushes to main close together start two independent stand+showcase
    # pairs; without this, whichever showcase happens to finish its own work
    # last wins the force-push, regardless of which commit is newer. This
    # group makes publications serialise instead of race: only one showcase
    # job runs at a time, so there is no window where two of them are both
    # mid-build and racing on the same `git push --force`.
    # cancel-in-progress is deliberately false: a cancelled publication can
    # be interrupted mid-script, and while the assemble-then-single-push
    # shape means that can never leave gh-pages itself half-written, it
    # would still waste the run and delay the next one for nothing — a
    # delayed publication is a strictly better outcome than a cancelled one.
    # This does not guarantee the newest commit always publishes last (if an
    # older commit's `stand` job happens to run much slower, its showcase
    # can still become ready, queue, and run after a newer commit's already
    # finished); it only guarantees publications never overlap, which is
    # what makes the outcome deterministic instead of a timing race.
    concurrency:
      group: showcase-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: allure-results-stand
          path: allure-results
      # The recording is optional and its absence must not kill the
      # publication. `upload-artifact` creates no artifact at all for an empty
      # `videos/`, and `download-artifact` answers that with "Unable to find
      # an artifact", which failed the job outright — so the degradation both
      # the publish script and showcase/build.py were written for could never
      # run. Letting this one step fail leaves `videos/` empty, which is
      # exactly the case they handle: the page says there is nothing to play.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: videos
          path: videos
      - name: Assemble and publish
        run: bash scripts/publish-showcase.sh allure-results videos
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  api:
    name: API tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m api
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: allure-results

  reachable:
    name: Storefront reachable from this runner
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      status: ${{ steps.probe.outputs.status }}
    steps:
      - id: probe
        name: Probe the storefront
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://practicesoftwaretesting.com)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "Storefront responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::notice title=Browser tests skipped::The hosted storefront answered HTTP $code from this runner. It blocks data-centre IP ranges, so the browser suite cannot reach the application. This is an environment limitation, not a product failure — run the browser tests locally."
          fi

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [api, reachable]
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && needs.reachable.outputs.status == '200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m "ui or e2e" --reruns 1 --reruns-delay 2
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          HEADLESS: "true"
          TIMEOUT_MS: "30000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-browser
          path: allure-results
