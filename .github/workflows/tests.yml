name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m api
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: allure-results

  reachable:
    name: Storefront reachable from this runner
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.probe.outputs.status }}
    steps:
      - id: probe
        name: Probe the storefront
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://practicesoftwaretesting.com)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "Storefront responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::notice title=Browser tests skipped::The hosted storefront answered HTTP $code from this runner. It blocks data-centre IP ranges, so the browser suite cannot reach the application. This is an environment limitation, not a product failure — run the browser tests locally."
          fi

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [api, reachable]
    if: needs.reachable.outputs.status == '200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m "ui or e2e" --reruns 1 --reruns-delay 2
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          HEADLESS: "true"
          TIMEOUT_MS: "30000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-browser
          path: allure-results
