name: tests

# The gate: a change proposed or landed here, run against the stand the job
# starts itself, so a failure is always about the code. Nothing in this file
# reaches the hosted storefront — that check is hosted-site.yml, started by
# hand — so the badge bound to this workflow says nothing about anybody else's
# site.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  stand:
    name: Full suite on our own stand
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Bring up the application under test
        run: ./scripts/stand-up.sh
      - name: Run every layer, writes included
        run: pytest -m "" --reruns 1 --reruns-delay 2
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          BASE_URL: http://localhost:4200
          API_BASE_URL: http://localhost:8091
          MOCK_CONTACT_API: "false"
          TIMEOUT_MS: "10000"
          RECORD_VIDEO: "true"
      - name: Stand logs
        if: failure()
        run: docker compose -f docker-compose.stand.yml logs --tail 200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-stand
          path: allure-results
      # A green run without a browser failure still records the two e2e
      # flows, but a run can end with none — and an empty directory is not an
      # error here, so it is not warned about either. What the publish job
      # does when the artefact is missing is handled where it downloads it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: videos
          path: videos
          if-no-files-found: ignore

  showcase:
    name: Publish showcase
    runs-on: ubuntu-24.04
    needs: stand
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The site goes to GitHub Pages as an artifact of this run: no branch is
    # written, so nothing is ever force-pushed and nothing piles up from one
    # publication to the next.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publication at a time, from reading the report history back off the
    # live site to deploying: two that overlapped would start from the same
    # history, and whichever deployed last would drop the other's run from the
    # trend. A deployment under way is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: allure-results-stand
          path: allure-results
      # The recording is optional and its absence must not kill the
      # publication. `upload-artifact` creates no artifact at all for an empty
      # `videos/`, and `download-artifact` answers that with "Unable to find
      # an artifact", which failed the job outright — so the degradation both
      # the build script and showcase/build.py were written for could never
      # run. Letting this one step fail leaves `videos/` empty, which is
      # exactly the case they handle: the page says there is nothing to play.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: videos
          path: videos
      - name: Assemble the site
        run: bash scripts/build-showcase.sh allure-results videos
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: https://wolfgung.github.io/Toolshop-Test-Automation-Framework/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
