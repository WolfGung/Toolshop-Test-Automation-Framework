name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  stand:
    name: Full suite on our own stand
    runs-on: ubuntu-latest
    # The gate, and only the gate: a change proposed or landed here. The
    # nightly schedule and a manual dispatch are the watch on the hosted
    # storefront, which is what docs/06 and the pipeline diagram describe, and
    # what the three jobs below are gated on. Without this the nightly also
    # brought up the stand and ran the whole suite against it, so the schedule
    # did something neither text mentioned.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Bring up the application under test
        run: ./scripts/stand-up.sh
      - name: Run every layer, writes included
        run: pytest -m "" --reruns 1 --reruns-delay 2
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          BASE_URL: http://localhost:4200
          API_BASE_URL: http://localhost:8091
          MOCK_CONTACT_API: "false"
          TIMEOUT_MS: "10000"
          RECORD_VIDEO: "true"
      - name: Stand logs
        if: failure()
        run: docker compose -f docker-compose.stand.yml logs --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-stand
          path: allure-results
      # A green run without a browser failure still records the two e2e
      # flows, but a run can end with none — and an empty directory is not an
      # error here, so it is not warned about either. What the publish job
      # does when the artefact is missing is handled where it downloads it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: videos
          if-no-files-found: ignore

  showcase:
    name: Publish showcase
    runs-on: ubuntu-latest
    needs: stand
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The site goes to GitHub Pages as an artifact of this run: no branch is
    # written, so nothing is ever force-pushed and nothing piles up from one
    # publication to the next.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publication at a time, from reading the report history back off the
    # live site to deploying: two that overlapped would start from the same
    # history, and whichever deployed last would drop the other's run from the
    # trend. A deployment under way is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: allure-results-stand
          path: allure-results
      # The recording is optional and its absence must not kill the
      # publication. `upload-artifact` creates no artifact at all for an empty
      # `videos/`, and `download-artifact` answers that with "Unable to find
      # an artifact", which failed the job outright — so the degradation both
      # the build script and showcase/build.py were written for could never
      # run. Letting this one step fail leaves `videos/` empty, which is
      # exactly the case they handle: the page says there is nothing to play.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: videos
          path: videos
      - name: Assemble the site
        run: bash scripts/build-showcase.sh allure-results videos
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: https://wolfgung.github.io/Toolshop-Test-Automation-Framework/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  api:
    name: API tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Runs against the public demo shop, which is not ours: it can fail this job, never the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m api
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: allure-results

  reachable:
    name: Storefront reachable from this runner
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Probes the public demo shop, which is not ours: this job never fails the run.
    continue-on-error: true
    outputs:
      status: ${{ steps.probe.outputs.status }}
    steps:
      - id: probe
        name: Probe the storefront
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://practicesoftwaretesting.com) || true
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "Storefront responded with HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::notice title=Browser tests skipped::The hosted storefront did not answer this runner at all: curl reports HTTP 000, meaning no response. The browser suite could not reach the application and did not run, so this says nothing about the product — run the browser tests locally."
          elif [ "$code" != "200" ]; then
            echo "::notice title=Browser tests skipped::The hosted storefront answered HTTP $code from this runner. It blocks data-centre IP ranges, so the browser suite cannot reach the application. This is an environment limitation, not a product failure — run the browser tests locally."
          fi

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [api, reachable]
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && needs.reachable.outputs.status == '200'
    # Runs against the public demo shop, which is not ours: it can fail this job, never the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m "ui or e2e" --reruns 1 --reruns-delay 2
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          HEADLESS: "true"
          TIMEOUT_MS: "30000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-browser
          path: allure-results
