name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m api
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: allure-results

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m "ui or e2e" --reruns 1 --reruns-delay 2
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          HEADLESS: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-browser
          path: allure-results
