[pytest]
testpaths = tests
addopts =
    -ra
    -m "not creates_data"
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
markers =
    smoke: minimal set that must pass on every deploy
    api: tests against the REST API only
    ui: tests that drive a browser
    e2e: full business flows across UI and API
    negative: invalid input and error handling
    boundary: limits and edge values
    creates_data: writes data to the shared demo backend (deselected by default)
